<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vanguard OS</title>

  <script>
    // beforeinstallprompt solo se dispara una vez y puede llegar en
    // cualquier momento después de que Chrome evalúa los criterios de
    // instalación — hay que engancharlo acá arriba, antes de que cargue el
    // resto de la app (ver js/views/dashboard.js, que lee
    // window.__vgInstall.deferredPrompt para mostrar el banner de Inicio),
    // o se pierde el evento sin que nadie lo haya escuchado.
    window.__vgInstall = { deferredPrompt: null };
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__vgInstall.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('vg-install-available'));
    });
    window.addEventListener('appinstalled', () => {
      window.__vgInstall.deferredPrompt = null;
    });
  </script>
  
  <!-- Icon & PWA -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <!-- debe coincidir con --bg de variables.css -->
  <meta name="theme-color" content="#05070A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen" style="position: fixed; inset: 0; background: var(--bg-base); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s ease-out; opacity: 1;">
    <div id="splash-brand" style="font-size: 48px; font-weight: 800; letter-spacing: 2px; color: var(--text-primary);">VANGUARD</div>
    <div id="splash-progress-track" style="width: 120px; height: 4px; background: var(--surface-2); border-radius: 2px; margin-top: 24px; overflow: hidden;">
      <div id="splash-progress-bar" style="height: 100%; background: var(--accent-primary); width: 0%; transition: width 0.2s ease-out;"></div>
    </div>
    <!-- Manual Entrar Button -->
    <button id="splash-enter-btn" class="tappable" style="display:none; margin-top: 40px; background: var(--accent-primary); color: #000; border: none; padding: 12px 32px; border-radius: 24px; font-weight: 700; font-size: 16px; cursor: pointer; animation: fadeIn 0.2s ease-out;">
      Entrar
    </button>
    <!-- Error state: shown only if loadModuleGraph falla completamente (ver bootstrap() más abajo) -->
    <div id="splash-error" style="display:none; text-align:center; margin-top: 24px; max-width: 280px; padding: 0 16px;">
      <p style="color: var(--text-secondary); font-size: 14px; margin: 0 0 16px 0; line-height: 1.4;">No se pudo cargar la aplicación. Revisá tu conexión e intentá de nuevo.</p>
      <button id="splash-retry-btn" class="tappable" style="background: var(--accent-primary); color: #000; border: none; padding: 12px 32px; border-radius: 24px; font-weight: 700; font-size: 16px; cursor: pointer;">
        Reintentar
      </button>
    </div>
  </div>

    <!-- Navigation Bar -->
    <nav id="app-nav">
      <div class="nav-brand">VANGUARD</div>
      <a href="#dashboard" class="nav-item active tappable" data-view="dashboard">

    <!-- Vista Principal Montada por app.js -->
    <main id="view-root"></main>

  <!-- Global Toast Container -->
  <div id="toast-container" style="position: fixed; bottom: calc(env(safe-area-inset-bottom) + 90px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 4000; pointer-events: none; width: 90%; max-width: 400px;"></div>

  <!-- Global Confirm Dialog -->
  <div id="global-confirm-modal" class="modal-overlay" style="z-index: 5000;">
    <div class="modal-content" style="padding: 24px; border-radius: 24px; text-align: center; max-width: 320px; margin: auto; transform: scale(0.95); opacity: 0; transition: all 220ms ease-out;">
      <div id="confirm-icon" style="font-size: 32px; margin-bottom: 16px;"><svg width="48" height="48" fill="none" stroke="var(--state-high)" stroke-width="2" viewBox="0 0 24 24" style="display:inline-block;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
      <h3 id="confirm-title" style="font-size: 18px; font-weight: 600; margin: 0 0 8px 0; color: var(--text-primary);">Confirmar</h3>
      <p id="confirm-message" style="font-size: 14px; color: var(--text-secondary); margin: 0 0 24px 0; line-height: 1.4;">¿Estás seguro?</p>
      <div style="display: flex; gap: 12px;">
        <button id="confirm-cancel" class="tappable" style="flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--surface-2); color: var(--text-primary); font-weight: 600; cursor: pointer;">Cancelar</button>
        <button id="confirm-ok" class="tappable" style="flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--state-high); color: #000; font-weight: 600; cursor: pointer;">Confirmar</button>
      </div>
    </div>
  </div>

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(reg => {
            console.log('SW registrado con exito', reg.scope);
          }).catch(err => console.error('Error al registrar SW:', err));
        });
      }
    </script>
  <script type="module">
    // Progreso real del splash (ver #splash-progress-bar arriba). Esta carga
    // (el grafo de js/core/app.js) es la primera etapa del arranque; la
    // ocupamos del 0% al 30% de la barra. La segunda etapa (el grafo de la
    // vista inicial, que es la parte más pesada) la maneja Router en
    // js/core/app.js y ocupa del 30% al 100% — ver window.__vgSplashProgress.
    window.__vgSplashProgress = function (fraction) {
      const bar = document.getElementById('splash-progress-bar');
      if (bar) bar.style.width = `${Math.max(0, Math.min(100, fraction * 100))}%`;
    };

    // El servidor local a veces omite el header Content-Type cuando recibe
    // varias peticiones en paralelo, y no manda headers de caché, así que
    // ni siquiera "precalentar" evita que el navegador vuelva a pedir todo
    // en paralelo al resolver los imports de un módulo. Un
    // <script type="module"> estático además no se puede reintentar.
    // Solución: bajar los archivos del grafo con un pool de descargas en
    // paralelo acotado (ver CONCURRENCY en loadModuleGraph), cada una con
    // reintento propio y validación de Content-Type, y armar el módulo como
    // Blob URL reescribiendo sus imports relativos para que apunten a los
    // Blob URL ya resueltos de sus dependencias — así el import() final no
    // dispara ninguna petición de red nueva. GitHub Pages sí manda
    // Content-Type correcto bajo concurrencia; esto era un problema del
    // servidor local de desarrollo.
    //
    // OJO: esta función (fetchTextWithRetry + loadModuleGraph) está
    // DUPLICADA en js/core/app.js — este bootstrap no puede importar nada
    // (es justamente lo que carga el primer módulo), así que no hay forma
    // de compartir el código. Cualquier cambio acá hay que replicarlo
    // también allá, o quedan desincronizadas.
    async function fetchTextWithRetry(url, attempts = 5) {
      let lastErr;
      for (let i = 0; i < attempts; i++) {
        try {
          const res = await fetch(i === 0 ? url : `${url}?retry=${Date.now()}_${i}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status} al pedir ${url}`);
          const ct = res.headers.get('content-type') || '';
          if (!/javascript|ecmascript/i.test(ct)) throw new Error(`Content-Type inválido ("${ct || 'vacío'}") al pedir ${url}`);
          return await res.text();
        } catch (err) {
          lastErr = err;
          if (i < attempts - 1) await new Promise(r => setTimeout(r, 80 * (i + 1)));
        }
      }
      throw lastErr;
    }

    // Cuántas descargas del grafo corren en paralelo. GitHub Pages manda
    // Content-Type correcto aun bajo concurrencia (a diferencia del server
    // local que motivó bajar todo secuencial en su momento — ver el comment
    // de arriba). fetchTextWithRetry sigue validando Content-Type y
    // reintentando por archivo, así que si algún host devuelve basura bajo
    // carga, un par de archivos reintentan solos sin tumbar el resto.
    const CONCURRENCY = 6;

    async function loadModuleGraph(entryUrl, onProgress) {
      const importLineRe = /^import\s+(?:[^;\n]*?\sfrom\s+)?['"](\.[^'"]+)['"]/gm;
      const texts = new Map();
      const deps = new Map();
      const seen = new Set([entryUrl]);
      const queue = [entryUrl];
      let total = 1;
      let done = 0;

      // Pool de descargas en paralelo (acotado a CONCURRENCY) que va
      // descubriendo el grafo a medida que cada archivo se resuelve — no
      // sabemos el total de archivos de antemano, así que "total" crece a
      // medida que aparecen nuevos imports. launch() se re-llama cada vez
      // que una descarga termina, para mantener el pool lleno; el orden
      // topológico de más abajo no depende del orden en que llegan.
      await new Promise((resolve, reject) => {
        let active = 0;
        let failed = false;
        const launch = () => {
          if (failed) return;
          while (active < CONCURRENCY && queue.length > 0) {
            const url = queue.shift();
            active++;
            fetchTextWithRetry(url).then(text => {
              texts.set(url, text);
              done++;
              if (onProgress) onProgress(done, total);

              const fileDeps = [];
              let m;
              importLineRe.lastIndex = 0;
              while ((m = importLineRe.exec(text))) {
                const abs = new URL(m[1], url).href;
                fileDeps.push({ specifier: m[1], absUrl: abs });
                if (!seen.has(abs)) { seen.add(abs); total++; queue.push(abs); }
              }
              deps.set(url, fileDeps);

              active--;
              if (failed) return;
              if (queue.length === 0 && active === 0) resolve();
              else launch();
            }).catch(err => { failed = true; reject(err); });
          }
        };
        launch();
      });

      const order = [];
      const visited = new Set();
      (function visit(url) {
        if (visited.has(url)) return;
        visited.add(url);
        for (const d of deps.get(url) || []) visit(d.absUrl);
        order.push(url);
      })(entryUrl);

      const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const blobUrls = new Map();
      for (const url of order) {
        let text = texts.get(url);
        for (const d of deps.get(url) || []) {
          const finalUrl = blobUrls.get(d.absUrl);
          const specRe = new RegExp(`(^import\\s+(?:[^;\\n]*?\\sfrom\\s+)?['"])${escapeRe(d.specifier)}(['"])`, 'm');
          text = text.replace(specRe, `$1${finalUrl}$2`);
        }
        const blob = new Blob([text], { type: 'text/javascript' });
        blobUrls.set(url, URL.createObjectURL(blob));
      }
      return blobUrls.get(entryUrl);
    }

    async function bootstrap() {
      const appUrl = new URL('./js/core/app.js', location.href).href;
      try {
        const blobUrl = await loadModuleGraph(appUrl, (done, total) => {
          window.__vgSplashProgress(0.3 * (done / total));
        });
        await import(blobUrl);
      } catch (err) {
        // No recargamos a ciegas: si el fallo es persistente (sin red,
        // GitHub Pages caído, etc.) un location.reload() automático entra
        // en loop infinito recargando una y otra vez sin avisar a nadie.
        // Mostramos el error y dejamos el reintento en manos del usuario.
        console.error('No se pudo iniciar la app:', err);
        const track = document.getElementById('splash-progress-track');
        const enterBtn = document.getElementById('splash-enter-btn');
        const errorBox = document.getElementById('splash-error');
        const retryBtn = document.getElementById('splash-retry-btn');
        if (track) track.style.display = 'none';
        if (enterBtn) enterBtn.style.display = 'none';
        if (errorBox) errorBox.style.display = 'block';
        if (retryBtn) retryBtn.addEventListener('click', () => location.reload());
      }
    }
    bootstrap();
  </script>
</body>
</html>
