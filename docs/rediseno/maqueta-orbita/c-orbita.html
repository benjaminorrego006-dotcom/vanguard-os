<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#0C0A1C; --s1:rgba(255,255,255,.06); --s2:rgba(255,255,255,.10); --line:rgba(255,255,255,.10);
  --tx:#F4F2FF; --tx2:#A9A3C9; --tx3:#6E6890;
  --hab1:#FF4D8D; --hab2:#FF8A5C; --plan1:#7C5CFF; --plan2:#B79BFF; --ent1:#19E3D2; --ent2:#2FA8FF; --fin1:#FFC23D; --fin2:#FF8A1F;
  --f:'Sora',sans-serif; --m:'Geist Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;background:var(--bg);color:var(--tx);font-family:var(--f);overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font:600 15px var(--f);position:relative}
.wrap{padding:0 18px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.top .d{font:300 13px var(--f);color:var(--tx2)}
.top .d b{display:block;font:700 22px var(--f);color:var(--tx);letter-spacing:-.02em}
.badges{display:flex;gap:8px}
.bd{height:36px;padding:0 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font:600 12px var(--m);backdrop-filter:blur(10px)}
.orbit{position:relative;height:244px;margin-top:8px;display:grid;place-items:center}
.center{position:absolute;text-align:center}
.center b{font:800 54px/1 var(--f);letter-spacing:-.05em;display:block;background:linear-gradient(180deg,#fff,#CFC8FF);-webkit-background-clip:text;color:transparent}
.center small{font:500 9px var(--m);letter-spacing:.12em;color:var(--tx2)}
.lg{position:absolute;font:600 11px var(--f);display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(12,10,28,.7);border:1px solid var(--line)}
.lg i{width:8px;height:8px;border-radius:50%}
.lg span{font-family:var(--m);color:var(--tx2);font-weight:500}
.deck{position:relative;height:150px;margin-top:12px}
.cardx{position:absolute;left:0;right:0;border-radius:26px}
.c3{top:0;margin:0 26px;height:120px;background:rgba(255,255,255,.05)}
.c2{top:8px;margin:0 13px;height:124px;background:rgba(255,255,255,.08)}
.c1{top:18px;height:132px;background:linear-gradient(135deg,rgba(255,77,141,.30),rgba(124,92,255,.22));border:1px solid rgba(255,255,255,.16);padding:16px 16px;display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(12px)}
.k{font:600 10px var(--m);letter-spacing:.16em;color:#FFB3CC}
.c1 h3{font:700 20px var(--f);letter-spacing:-.02em;margin-top:5px}
.row{display:flex;align-items:center;gap:10px}
.xp{font:600 12px var(--m);color:var(--tx2)}
.done{margin-left:auto;height:46px;padding:0 20px;border-radius:999px;background:linear-gradient(90deg,var(--hab1),var(--hab2));font:700 14px var(--f);display:flex;align-items:center;gap:8px;color:#fff;box-shadow:0 8px 24px rgba(255,77,141,.45)}
.skip{height:46px;width:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;font:500 11px var(--f);color:var(--tx2)}
.q div{width:60px;height:60px;border-radius:22px;display:grid;place-items:center;position:relative}
.dock{position:absolute;left:20px;right:20px;bottom:24px;height:68px;border-radius:34px;background:rgba(30,26,58,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.di{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--tx3)}
.di.on{width:56px;height:56px;background:conic-gradient(from 200deg,var(--hab1),var(--plan1),var(--ent1),var(--fin1),var(--hab1));padding:3px}
.di.on span{width:100%;height:100%;border-radius:50%;background:#16122E;display:grid;place-items:center;color:#fff}
</style></head><body>
<div class="blob" style="width:260px;height:260px;background:#7C5CFF;left:-80px;top:120px"></div>
<div class="blob" style="width:220px;height:220px;background:#FF4D8D;right:-90px;top:60px;opacity:.35"></div>
<div class="blob" style="width:260px;height:200px;background:#19E3D2;right:-60px;bottom:120px;opacity:.18"></div>
<div class="status"><span>16:39</span><span style="display:flex;gap:6px"><svg width="17" height="11" viewBox="0 0 17 11" fill="#F4F2FF"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#F4F2FF" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="#F4F2FF"/></svg></span></div>
<div class="wrap">
  <div class="top">
    <div class="d">Lunes 23 nov<b>Vamos, Benjamín</b></div>
    <div class="badges">
      <div class="bd"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFC23D"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient></defs></svg>12</div>
      <div class="bd" style="color:#CFC2FF">Nv 14</div>
    </div>
  </div>

  <div class="orbit">
    <svg width="236" height="236" viewBox="0 0 290 290">
      <defs>
        <linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF4D8D"/><stop offset="1" stop-color="#FF8A5C"/></linearGradient>
        <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C5CFF"/><stop offset="1" stop-color="#B79BFF"/></linearGradient>
        <linearGradient id="ge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19E3D2"/><stop offset="1" stop-color="#2FA8FF"/></linearGradient>
        <linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC23D"/><stop offset="1" stop-color="#FF8A1F"/></linearGradient>
      </defs>
      <g fill="none" stroke-width="14" stroke-linecap="round" transform="rotate(-90 145 145)">
        <circle cx="145" cy="145" r="132" stroke="rgba(255,255,255,.07)"/>
        <circle cx="145" cy="145" r="132" stroke="url(#gh)" stroke-dasharray="553 829"/>
        <circle cx="145" cy="145" r="112" stroke="rgba(255,255,255,.07)"/>
        <circle cx="145" cy="145" r="112" stroke="url(#gp)" stroke-dasharray="422 704"/>
        <circle cx="145" cy="145" r="92" stroke="rgba(255,255,255,.07)"/>
        <circle cx="145" cy="145" r="92" stroke="url(#ge)" stroke-dasharray="60 578"/>
        <circle cx="145" cy="145" r="72" stroke="rgba(255,255,255,.07)"/>
        <circle cx="145" cy="145" r="72" stroke="url(#gf)" stroke-dasharray="300 452"/>
      </g>
    </svg>
    <div class="center"><b>64</b><small>DÍA</small></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,max-content);gap:6px;justify-content:center;margin-top:2px">
    <div class="lg" style="position:static"><i style="background:var(--hab1)"></i>Hábitos <span>4/6</span></div>
    <div class="lg" style="position:static"><i style="background:var(--plan1)"></i>Tareas <span>3/5</span></div>
    <div class="lg" style="position:static"><i style="background:var(--ent1)"></i>Entreno <span>0/1</span></div>
    <div class="lg" style="position:static"><i style="background:var(--fin1)"></i>Presup. <span>66%</span></div>
  </div>

  <div class="deck">
    <div class="cardx c3"></div><div class="cardx c2"></div>
    <div class="cardx c1">
      <div><div class="k">SIGUIENTE MISIÓN · 1 DE 4</div><h3>Inglés 15 min</h3></div>
      <div class="row"><span class="xp">+40 XP · cierra el anillo</span><span class="done"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>Hecho</span></div>
    </div>
  </div>

  <div class="quick">
    <div class="q"><div style="background:linear-gradient(135deg,rgba(255,194,61,.25),rgba(255,138,31,.15));color:#FFC23D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3 4.5 1.4 4.5 3.2-2 3-4.5 3-4.5-1.3-4.5-3"/></svg></div>Gasto</div>
    <div class="q"><div style="background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(183,155,255,.12));color:#B79BFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></div>Tarea</div>
    <div class="q"><div style="background:linear-gradient(135deg,rgba(25,227,210,.25),rgba(47,168,255,.15));color:#19E3D2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></div>Entrenar</div>
    <div class="q"><div style="background:linear-gradient(135deg,rgba(255,77,141,.28),rgba(255,138,92,.14));color:#FF7AA8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div>Hábito</div>
  </div>
  <div style="margin-top:12px;height:50px;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px">
    <span style="font:600 13px var(--m);color:#B79BFF">18:30</span><span style="font:500 13px var(--f)">Ayudantía Econometría</span><span style="margin-left:auto;font:500 11px var(--m);color:var(--tx2)">en 1h 51m</span>
  </div>
</div>

<div class="dock">
  <div class="di"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div>
  <div class="di"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></div>
  <div class="di on"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg></span></div>
  <div class="di"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></div>
  <div class="di"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20"/></svg></div>
</div>
</body></html>
